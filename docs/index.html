cación. Las edades no casan entre 1983 y 2000. Fox nunca cuidó la continuidad, y no hay orden que lo arregle.`},{t:`Las series`,p:`The Gifted, Legion, la serie animada y X-Men '97 van por libre: no afectan a las películas ni las películas a ellas.`}],eras:[{era:`La línea original`,rango:`1962–2023`,c:[`#E8A93C`,`#8A5408`],items:[{id:`first-class`,pc:`0`,t:`X-Men: Primera generación`,h:`1962`,r:2011,s:7.7,d:132,plat:`Disney+`,dir:`Matthew Vaughn`,cast:[`James McAvoy`,`Michael Fassbender`,`Jennifer Lawrence`],res:`Charles y Erik se conocen en plena Guerra Fría y fundan los primeros X-Men.`},{id:`origins-wolverine`,pc:`1 al final`,t:`X-Men Orígenes: Lobezno`,h:`1845–1979`,r:2009,s:6.5,d:107,plat:`Disney+`,dir:`Gavin Hood`,cast:[`Hugh Jackman`,`Liev Schreiber`,`Ryan Reynolds`],res:`El pasado de Logan: el programa Arma X y el adamantium.`,n:`Salta entre décadas; su grueso ocurre en 1979. La bala de adamantium del final le borra la memoria: por eso en X-Men (2000) no recuerda nada.`},{id:`xmen1`,pc:`0`,t:`X-Men`,h:`2000`,r:2e3,s:7.3,d:104,plat:`Disney+`,dir:`Bryan Singer`,cast:[`Hugh Jackman`,`Patrick Stewart`,`Ian McKellen`],res:`Magneto amenaza a la humanidad y los X-Men de Xavier debutan en el cine.`,n:`Línea original: esta Mística (Rebecca Romijn) está viva porque la línea aún no ha sido borrada.`},{id:`x2`,pc:`0`,t:`X-Men 2`,h:`2003`,r:2003,s:7.4,d:134,plat:`Disney+`,dir:`Bryan Singer`,cast:[`Hugh Jackman`,`Patrick Stewart`,`Ian McKellen`],res:`Un militar ataca la mansión y obliga a mutantes rivales a aliarse.`},{id:`last-stand`,pc:`1 al final`,t:`X-Men: La decisión final`,h:`2006`,r:2006,s:6.6,d:104,plat:`Disney+`,dir:`Brett Ratner`,cast:[`Hugh Jackman`,`Halle Berry`,`Ian McKellen`],res:`Una «cura» mutante y el regreso de Fénix lo dividen todo.`,n:`Mueren Jean, Cíclope y Xavier, y Magneto pierde sus poderes: todo esto será borrado en Días del futuro pasado. Quédate a la escena tras los créditos, que explica cómo vuelve Xavier.`},{id:`the-wolverine`,pc:`1 a mitad`,pcn:`prepara Días del futuro pasado`,t:`Lobezno inmortal`,h:`2013`,r:2013,s:6.7,d:126,plat:`Disney+`,dir:`James Mangold`,cast:[`Hugh Jackman`,`Tao Okamoto`,`Rila Fukushima`],res:`Logan viaja a Japón y se enfrenta a su propia inmortalidad.`,n:`Sus post-créditos son la bisagra de la saga: Xavier y Magneto, con poderes otra vez, avisan de Trask y los Centinelas.`},{id:`dofp`,pc:`1 al final`,t:`X-Men: Días del futuro pasado`,h:`1973 y 2023`,r:2014,s:7.9,d:132,plat:`Disney+`,dir:`Bryan Singer`,cast:[`Hugh Jackman`,`James McAvoy`,`Michael Fassbender`],res:`Lobezno viaja a 1973 para evitar el futuro de los Centinelas.`,n:`Aquí se parte la saga: el 2023 de los Centinelas es el futuro de la línea original (la de X-Men 1, 2 y 3), y el viaje a 1973 la borra. Todo lo que viene después ocurre en la línea nueva.`}]},{era:`La línea nueva`,rango:`1983–2029`,c:[`#C98A10`,`#6E4204`],items:[{id:`apocalypse`,pc:`1 al final`,t:`X-Men: Apocalipsis`,h:`1983`,r:2016,s:6.9,d:144,plat:`Disney+`,dir:`Bryan Singer`,cast:[`James McAvoy`,`Michael Fassbender`,`Oscar Isaac`],res:`El primer mutante de la historia despierta y quiere rehacer el mundo.`,n:`Primera película que ocurre entera en la línea nueva.`},{id:`dark-phoenix`,pc:`0`,t:`X-Men: Fénix Oscura`,h:`1992`,r:2019,s:5.7,d:114,plat:`Disney+`,dir:`Simon Kinberg`,cast:[`Sophie Turner`,`James McAvoy`,`Jessica Chastain`],res:`Jean Grey absorbe una fuerza cósmica que no puede controlar.`,n:`Mística muere aquí, en la línea nueva; la Mística de X-Men 1 y 2 vivía en la línea borrada.`},{id:`deadpool1`,pc:`1 al final`,pcn:`al estilo Ferris Bueller`,t:`Deadpool`,h:`2016`,r:2016,s:8,d:108,plat:`Disney+`,exp:!0,dir:`Tim Miller`,cast:[`Ryan Reynolds`,`Morena Baccarin`,`Ed Skrein`],res:`Wade Wilson busca venganza sin dejar de romper la cuarta pared.`},{id:`deadpool2`,pc:`1 a mitad`,pcn:`imprescindible: reescribe el final`,t:`Deadpool 2`,h:`2018`,r:2018,s:7.6,d:119,plat:`Disney+`,exp:!0,dir:`David Leitch`,cast:[`Ryan Reynolds`,`Josh Brolin`,`Zazie Beetz`],res:`Wade monta la X-Force para proteger a un chaval del viajero temporal Cable.`,n:`Confirma la línea nueva: en la mansión aparecen los X-Men jóvenes de Apocalipsis. La escena post-créditos que mata al Deadpool de Orígenes es un chiste; no cuenta.`},{id:`new-mutants`,pc:`0`,t:`Los Nuevos Mutantes`,h:`~2020`,r:2020,s:5.3,d:94,plat:`Disney+`,opt:!0,dir:`Josh Boone`,cast:[`Maisie Williams`,`Anya Taylor-Joy`,`Charlie Heaton`],res:`Cinco jóvenes mutantes atrapados en un hospital lleno de secretos.`,n:`Historia independiente; su fecha exacta es ambigua.`},{id:`logan`,pc:`0`,t:`Logan`,h:`2029`,r:2017,s:8.1,d:137,plat:`Disney+`,exp:!0,dir:`James Mangold`,cast:[`Hugh Jackman`,`Patrick Stewart`,`Dafne Keen`],res:`Un Logan envejecido cruza el país para salvar a una niña como él.`,n:`El cierre de la saga. Un futuro posible de la línea nueva, no una continuación exacta de Fénix Oscura: un ataque de Xavier mató a los X-Men fuera de cámara.`}]},{era:`Las series, con continuidad propia`,rango:`1992–2024`,c:[`#A8720A`,`#4F3103`],items:[{id:`gifted`,t:`The Gifted (T1–T2)`,h:`—`,r:2017,s:7.2,d:1250,tipo:`serie`,opt:!0,plat:`Disney+`,dir:`Matt Nix (creador)`,cast:[`Stephen Moyer`,`Amy Acker`,`Emma Dumont`],res:`Una familia huye con sus hijos mutantes en un mundo sin X-Men.`,n:`Continuidad paralela del universo Fox.`},{id:`legion`,t:`Legion (T1–T3)`,h:`—`,r:2017,s:8.1,d:1350,tipo:`serie`,opt:!0,plat:`Disney+`,dir:`Noah Hawley (creador)`,cast:[`Dan Stevens`,`Aubrey Plaza`,`Rachel Keller`],res:`David Haller, el hijo de Xavier, entre la esquizofrenia y un poder inmenso.`,n:`La rareza de autor del universo X-Men; continuidad propia.`},{id:`xmen-tas`,t:`X-Men: La serie animada`,h:`—`,r:1992,s:8.4,d:1672,tipo:`serie`,opt:!0,plat:`Disney+`,cast:[`Cedric Smith`,`Norm Spencer`,`Catherine Disher`],dir:`Eric Lewald (showrunner)`,res:`La serie de los 90 que definió a los X-Men para una generación.`,n:`Prólogo directo de X-Men '97: los foros la consideran imprescindible antes de '97.`},{id:`xmen97`,t:`X-Men '97`,h:`—`,r:2024,s:8.4,d:300,tipo:`serie`,opt:!0,plat:`Disney+`,cast:[`Terri Douglas`,`Ray Chase`,`Jennifer Hale`],dir:`Beau DeMayo (creador)`,res:`Continuación directa de la serie animada de los 90, y a su altura.`}]}]},{saga:`ucm`,titulo:`Universo Cinematográfico de Marvel`,uni:`Tierra-616`,desc:`Películas, series de Disney+ y especiales en orden cronológico de la historia, desde 1943 hasta hoy.`,guia:[{t:`La idea`,p:`A diferencia de los X-Men, el UCM es una sola línea: nada se borra. Los saltos que notarás vienen de dos cosas, el Chasquido y el multiverso, y las dos se explican aquí.`},{t:`El Chasquido y el Lapso`,p:`En Infinity War (2018) Thanos borra a la mitad del universo. Endgame salta cinco años, a 2023, y los devuelve. Todo lo posterior habla del «Lapso» (Blip): los desaparecidos no envejecieron, y por eso Peter Parker sigue en el instituto en 2024.`},{t:`Los viajes en el tiempo de Endgame no borran nada`,p:`Crean ramas. El Loki de 2012 escapa con el Teseracto y de ahí nacen la serie Loki, la TVA y las variantes: por eso Loki va justo después de Endgame aunque esté «fuera del tiempo». What If…?, Marvel Zombies y Your Friendly Neighborhood Spider-Man son otros universos: se ven ahí, pero no tocan la línea principal.`},{t:`El multiverso`,p:`No Way Home trae a los Spider-Man de las películas de Sony (por eso ese bloque va justo antes), y Multiverso de la locura y Loki T2 lo consolidan. Los 4 Fantásticos viven en otra Tierra, en unos años 60 alternativos. Y Deadpool y Lobezno viene del universo Fox: por eso la saga X-Men entera se ve antes y esa película casi al final, como puente. Doomsday junta a todos.`},{t:`Las series de Netflix y ABC`,p:`Agents of S.H.I.E.L.D., Daredevil, Jessica Jones y compañía se hicieron aparte y durante años no contaron. Daredevil: Born Again las recupera con los mismos actores. Se pueden saltar sin perder el hilo de las películas.`},{t:`Cómo saber dónde estás`,p:`Si mencionan el Lapso, estás después de 2023. Si Thanos sigu
