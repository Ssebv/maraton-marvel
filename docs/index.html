on los jóvenes: 1962 y 1973 son comunes a las dos líneas, y toda la línea nueva es suya. Hugh Jackman está en ambas porque su mente viaja.`},{t:`Mística`,p:`Muere en Fénix Oscura (1992, línea nueva). La que ves viva en X-Men y X-Men 2 es la de la línea borrada. No es un error de orden.`},{t:`Lo que no cuadra y conviene aceptar`,p:`Xavier camina en Orígenes y en 1973 pese a quedar paralítico en 1962 (DoFP lo explica con un suero; Orígenes, no). En el 2023 de DoFP Lobezno vuelve a tener garras de adamantium sin explicación. Las edades no casan entre 1983 y 2000. Fox nunca cuidó la continuidad, y no hay orden que lo arregle.`},{t:`Las series`,p:`The Gifted, Legion, la serie animada y X-Men '97 van por libre: no afectan a las películas ni las películas a ellas.`}],eras:[{era:`La línea original`,rango:`1962–2023`,c:[`#E8A93C`,`#8A5408`],items:[{id:`first-class`,pc:`0`,t:`X-Men: Primera generación`,h:`1962`,r:2011,s:7.7,d:132,plat:`Disney+`,dir:`Matthew Vaughn`,cast:[`James McAvoy`,`Michael Fassbender`,`Jennifer Lawrence`],res:`Charles y Erik se conocen en plena Guerra Fría y fundan los primeros X-Men.`},{id:`origins-wolverine`,pc:`1 al final`,t:`X-Men Orígenes: Lobezno`,h:`1845–1979`,r:2009,s:6.5,d:107,plat:`Disney+`,dir:`Gavin Hood`,cast:[`Hugh Jackman`,`Liev Schreiber`,`Ryan Reynolds`],res:`El pasado de Logan: el programa Arma X y el adamantium.`,n:`Salta entre décadas; su grueso ocurre en 1979. La bala de adamantium del final le borra la memoria: por eso en X-Men (2000) no recuerda nada.`},{id:`xmen1`,pc:`0`,t:`X-Men`,h:`2000`,r:2e3,s:7.3,d:104,plat:`Disney+`,dir:`Bryan Singer`,cast:[`Hugh Jackman`,`Patrick Stewart`,`Ian McKellen`],res:`Magneto amenaza a la humanidad y los X-Men de Xavier debutan en el cine.`,n:`Línea original: esta Mística (Rebecca Romijn) está viva porque la línea aún no ha sido borrada.`},{id:`x2`,pc:`0`,t:`X-Men 2`,h:`2003`,r:2003,s:7.4,d:134,plat:`Disney+`,dir:`Bryan Singer`,cast:[`Hugh Jackman`,`Patrick Stewart`,`Ian McKellen`],res:`Un militar ataca la mansión y obliga a mutantes rivales a aliarse.`},{id:`last-stand`,pc:`1 al final`,t:`X-Men: La decisión final`,h:`2006`,r:2006,s:6.6,d:104,plat:`Disney+`,dir:`Brett Ratner`,cast:[`Hugh Jackman`,`Halle Berry`,`Ian McKellen`],res:`Una «cura» mutante y el regreso de Fénix lo dividen todo.`,n:`Mueren Jean, Cíclope y Xavier, y Magneto pierde sus poderes: todo esto será borrado en Días del futuro pasado. Quédate a la escena tras los créditos, que explica cómo vuelve Xavier.`},{id:`the-wolverine`,pc:`1 a mitad`,pcn:`prepara Días del futuro pasado`,t:`Lobezno inmortal`,h:`2013`,r:2013,s:6.7,d:126,plat:`Disney+`,dir:`James Mangold`,cast:[`Hugh Jackman`,`Tao Okamoto`,`Rila Fukushima`],res:`Logan viaja a Japón y se enfrenta a su propia inmortalidad.`,n:`Sus post-créditos son la bisagra de la saga: Xavier y Magneto, con poderes otra vez, avisan de Trask y los Centinelas.`},{id:`dofp`,pc:`1 al final`,t:`X-Men: Días del futuro pasado`,h:`1973 y 2023`,r:2014,s:7.9,d:132,plat:`Disney+`,dir:`Bryan Singer`,cast:[`Hugh Jackman`,`James McAvoy`,`Michael Fassbender`],res:`Lobezno viaja a 1973 para evitar el futuro de los Centinelas.`,n:`Aquí se parte la saga: el 2023 de los Centinelas es el futuro de la línea original (la de X-Men 1, 2 y 3), y el viaje a 1973 la borra. Todo lo que viene después ocurre en la línea nueva.`}]},{era:`La línea nueva`,rango:`1983–2029`,c:[`#C98A10`,`#6E4204`],items:[{id:`apocalypse`,pc:`1 al final`,t:`X-Men: Apocalipsis`,h:`1983`,r:2016,s:6.9,d:144,plat:`Disney+`,dir:`Bryan Singer`,cast:[`James McAvoy`,`Michael Fassbender`,`Oscar Isaac`],res:`El primer mutante de la historia despierta y quiere rehacer el mundo.`,n:`Primera película que ocurre entera en la línea nueva.`},{id:`dark-phoenix`,pc:`0`,t:`X-Men: Fénix Oscura`,h:`1992`,r:2019,s:5.7,d:114,plat:`Disney+`,dir:`Simon Kinberg`,cast:[`Sophie Turner`,`James McAvoy`,`Jessica Chastain`],res:`Jean Grey absorbe una fuerza cósmica que no puede controlar.`,n:`Mística muere aquí, en la línea nueva; la Mística de X-Men 1 y 2 vivía en la línea borrada.`},{id:`deadpool1`,pc:`1 al final`,pcn:`al estilo Ferris Bueller`,t:`Deadpool`,h:`2016`,r:2016,s:8,d:108,plat:`Disney+`,exp:!0,dir:`Tim Miller`,cast:[`Ryan Reynolds`,`Morena Baccarin`,`Ed Skrein`],res:`Wade Wilson busca venganza sin dejar de romper la cuarta pared.`},{id:`deadpool2`,pc:`1 a mitad`,pcn:`imprescindible: reescribe el final`,t:`Deadpool 2`,h:`2018`,r:2018,s:7.6,d:119,plat:`Disney+`,exp:!0,dir:`David Leitch`,cast:[`Ryan Reynolds`,`Josh Brolin`,`Zazie Beetz`],res:`Wade monta la X-Force para proteger a un chaval del viajero temporal Cable.`,n:`Confirma la línea nueva: en la mansión aparecen los X-Men jóvenes de Apocalipsis. La escena post-créditos que mata al Deadpool de Orígenes es un chiste; no cuenta.`},{id:`new-mutants`,pc:`0`,t:`Los Nuevos Mutantes`,h:`~2020`,r:2020,s:5.3,d:94,plat:`Disney+`,opt:!0,dir:`Josh Boone`,cast:[`Maisie Williams`,`Anya Taylor-Joy`,`Charlie Heaton`],res:`Cinco jóvenes mutantes atrapados en un hospital lleno de secretos.`,n:`Historia independiente; su fecha exacta es ambigua.`},{id:`logan`,pc:`0`,t:`Logan`,h:`2029`,r:2017,s:8.1,d:137,plat:`Disney+`,exp:!0,dir:`James Mangold`,cast:[`Hugh Jackman`,`Patrick Stewart`,`Dafne Keen`],res:`Un Logan envejecido cruza el país para salvar a una niña como él.`,n:`El cierre de la saga. Un futuro posible de la línea nueva, no una continuación exacta de Fénix Oscura: un ataque de Xavier mató a los X-Men fuera de cámara.`}]},{era:`Las series, con continuidad propia`,rango:`1992–2024`,c:[`#A8720A`,`#4F3103`],items:[{id:`gifted`,t:`The Gifted (T1–T2)`,h:`—`,r:2017,s:7.2,d:1250,tipo:`serie`,opt:!0,plat:`Disney+`,dir:`Matt Nix (creador)`,cast:[`Stephen Moyer`,`Amy Acker`,`Emma Dumont`],res:`Una familia huye con sus hijos mutantes en un mundo sin X-Men.`,n:`Continuidad paralela del universo Fox.`},{id:`legion`,t:`Legion (T1–T3)`,h:`—`,r:2017,s:8.1,d:1350,tipo:`serie`,opt:!0,plat:`Disney+`,dir:`Noah Hawley (creador)`,cast:[`Dan Stevens`,`Aubrey Plaza`,`Rachel Keller`],res:`David Haller, el hijo de Xavier, entre la esquizofrenia y un poder inmenso.`,n:`La rareza de autor del universo X-Men; continuidad propia.`},{id:`xmen-tas`,t:`X-Men: La serie animada`,h:`—`,r:1992,s:8.4,d:1672,tipo:`serie`,opt:!0,plat:`Disney+`,cast:[`Cedric Smith`,`Norm Spencer`,`Catherine Disher`],dir:`Eric Lewald (showrunner)`,res:`La serie de los 90 que definió a los X-Men para una generación.`,n:`Prólogo directo de X-Men '97: los foros la consideran imprescindible antes de '97.`},{id:`xmen97`,t:`X-Men '97`,h:`—`,r:2024,s:8.4,d:300,tipo:`serie`,opt:!0,plat:`Disney+`,cast:[`Terri Douglas`,`Ray Chase`,`Jennifer Hale`],dir:`Beau DeMayo (creador)`,res:`Continuación directa de la serie animada de los 90, y a su altura.`}]}]},{saga:`ucm`,titulo:`Universo Cinematográfico de Marvel`,uni:`Tierra-616`,desc:`Películas, series de Disney+ y especiales en orden cronológico de la historia, desde 1943 hasta hoy.`,guia:[{t:`La idea`,p:`A diferencia de los X-Men, el UCM es una sola línea: nada se borra. Los saltos que notarás vienen de dos cosas, el Chasquido y el multiverso, y las dos se explican aquí.`},{t:`El Chasquido y el Lapso`,p:`En Infinity War (2018) Thanos borra a la mitad del universo. Endgame salta cinco años, a 2023, y los devuelve. Todo lo posterior habla del «Lapso» (Blip): los desaparecidos no envejecieron, y por eso Peter Parker sigue en el instituto en 2024.`},{t:`Los viajes en el tiempo de Endgame no borran nada`,p:`Crean ramas. El Loki de 2012 escapa con el Teseracto y de ahí nacen la serie Loki, la TVA y las variantes: por eso Loki va justo después de Endgame aunque esté «fuera del tiempo». What If…?, Marvel Zombies y Your Friendly Neighborhood Spider-Man son otros universos: se ven ahí, pero no tocan la línea principal.`},{t:`El multiverso`,p:`No Way Home trae a los Spider-Man de las películas de Sony (por eso ese bloque va justo antes), y Multiverso de la locura y Loki T2 lo consolidan. Los 4 Fantásticos viven en otra Tierra, en unos años 60 alternativos. Y Deadpool y Lobezno viene del universo Fox: por eso la saga X-Men entera se ve antes y esa película casi al final, como puente. Doomsday junta a todos.`},{t:`Las series de Netflix y ABC`,p:`Agents of S.H.I.E.L.D., Daredevil, Jessica Jones y compañía se hicieron aparte y durante años no contaron. Daredevil: Born Again las recupera con los mismos actores. Se pueden saltar sin perder el hilo de las películas.`},{t:`Cómo saber dónde estás`,p:`Si mencionan el Lapso, estás después de 2023. Si Thanos sigue vivo, antes de 2018. Si alguien habla de variantes o de la TVA, estás en la saga del multiverso.`}],eras:[{era:`Los orígenes`,rango:`1943–2012`,c:[`#2B5DA8`,`#122A55`],items:[{id:`cap1`,pc:`1 al final`,t:`Capitán América: El primer vengador`,h:`1943–45`,r:2011,s:6.9,d:124,plat:`Disney+`,exp:!0,dir:`Joe Johnston`,cast:[`Chris Evans`,`Hayley Atwell`,`Hugo Weaving`],res:`Steve Rogers se convierte en el supersoldado que planta cara a Hydra.`},{id:`oneshot-carter`,t:`Agente Carter (One-Shot)`,h:`1946`,r:2013,d:16,tipo:`esp`,opt:!0,plat:`Disney+`,dir:`Louis D'Esposito`,cast:[`Hayley Atwell`,`Bradley Whitford`,`Dominic Cooper`],res:`Un año después de la guerra, Peggy busca el misterioso Zodiaco y planta cara a su jefe misógino.`,n:`El corto que dio pie a la serie: mejor justo antes de ella.`},{id:`agent-carter`,t:`Agente Carter (T1–T2)`,h:`1946–47`,r:2015,s:7.9,d:756,tipo:`serie`,opt:!0,plat:`Disney+`,dir:`Markus y McFeely (creadores)`,cast:[`Hayley Atwell`,`James D'Arcy`],res:`Peggy Carter funda en la posguerra lo que acabará siendo S.H.I.E.L.D.`},{id:`capmarvel`,pc:`2 (mitad y final)`,t:`Capitana Marvel`,h:`1995`,r:2019,s:6.8,d:123,plat:`Disney+`,dir:`Anna Boden y Ryan Fleck`,cast:[`Brie Larson`,`Samuel L. Jackson`,`Jude Law`],res:`Carol Danvers recompone su pasado en plena guerra entre Kree y Skrulls.`},{id:`ironman1`,pc:`1 al final`,pcn:`la escena que arrancó el UCM`,t:`Iron Man`,h:`2008`,r:2008,s:7.9,d:126,plat:`Netflix`,exp:!0,dir:`Jon Favreau`,cast:[`Rob lícula · Cine`,n:`El cierre de la Saga del Multiverso.`},{t:`X-Men (UCM)`,fecha:null,aprox:`En desarrollo`,tipo:`Película`,n:`El reinicio mutante dentro del UCM, tras Secret Wars.`}],Yt=[{num:`Tierra-616`,nombre:`El UCM — la Línea Sagrada`,ids:[`avengers1`,`endgame`,`loki1`],c:`#F0555B`,grupo:`ucm`,estado:`Línea sagrada · activa`,doom:`Es el escenario de Doomsday (18 dic 2026): los Thunderbolts, ya Nuevos Vengadores, responden a la llamada y la nave de los 4 Fantásticos llegó aquí en la escena poscréditos de Thunderbolts*.`,desc:`El universo principal del cine. Se llamó Tierra-199999 hasta que el libro oficial de Marvel Studios (The MCU: An Official Timeline, 2023) lo numeró 616, como el de los cómics, y Deadpool y Lobezno lo dijo en pantalla. Es la «línea temporal sagrada» que la TVA protege: cada evento nexo que la desvía genera una rama que la TVA poda.`},{num:`Tierra-10005`,nombre:`La saga X-Men de Fox`,ids:[`logan`,`deadpool3`],c:`#DC9E12`,grupo:`xmen`,estado:`Salvada · con un Logan de otra Tierra`,doom:`Los X-Men de Fox vuelven en Doomsday: Xavier (Patrick Stewart), Magneto (Ian McKellen), Cíclope, Bestia, Rondador, Mística y Gambito.`,desc:`El universo mutante de Fox. Su «ser ancla» era Lobezno: tras su muerte en Logan empezó a desvanecerse, hasta que Deadpool y un Lobezno de otra Tierra destruyen el Desgarrador Temporal y lo salvan; ese Logan se queda a vivir en él.`},{num:`El Vacío`,rasgo:`anillo`,nombre:`El vertedero del tiempo`,ids:[`loki1`,`loki2`,`deadpool3`],c:`#8A81EF`,estado:`Fin del tiempo · dominio de Alioth`,doom:`Loki (Tom Hiddleston) está en Doomsday: desde el final de Loki T2 sostiene las ramas del multiverso en el fin del tiempo, como un Yggdrasil.`,desc:`Donde la TVA arroja todo lo podado: no es destrucción, es exilio. Custodiado por Alioth y gobernado por Cassandra Nova en Deadpool y Lobezno, alberga variantes de Loki (el clásico, el niño, el caimán…) y reliquias de películas canceladas: el Blade, la Elektra y la Antorcha Humana de otros tiempos. Deadpool y Lobezno demostraron que se puede salir.`},{num:`Tierra-96283`,nombre:`El universo de Raimi`,ids:[`sm-raimi1`,`sm-raimi2`,`sm-raimi3`,`nwh`],c:`#E55D7A`,estado:`Convergió en No Way Home`,desc:`La trilogía de Tobey Maguire: el Spider-Man con telarañas orgánicas que demostró que el cine de superhéroes podía ser cine serio. Converge con la Tierra-616 en No Way Home.`},{num:`Tierra-120703`,nombre:`El universo de Garfield`,ids:[`asm1`,`asm2`,`nwh`],c:`#5492EC`,estado:`Convergió en No Way Home`,desc:`El Amazing Spider-Man: los mejores balanceos filmados y la historia con Gwen Stacy. Sony llegó a licenciar la Torre Oscorp para Los Vengadores antes de cancelar la conexión. También converge en No Way Home.`},{num:`Universo Sony`,rasgo:`simbionte`,nombre:`El Venomverso`,ids:[`venom1`,`venom2`,`morbius`,`madameweb`,`venom3`,`kraven`],c:`#8B92A5`,estado:`Activo · sin Spider-Man`,desc:`La Tierra-688 según Cruzando el Multiverso. Venom, Morbius, Madame Web y Kraven: simbiontes de Knull y la Red de la Vida… en un universo Spider-Man sin Spider-Man. Eddie Brock visitó brevemente la Tierra-616 y dejó allí un resto de simbionte que aún no ha estallado.`},{num:`Tierra-828`,rasgo:`luna`,nombre:`El mundo de los 4 Fantásticos`,ids:[`ff`],c:`#31A88E`,estado:`Activo · amenazado por Galactus`,doom:`En la escena poscréditos, Doom (Robert Downey Jr.) aparece junto al pequeño Franklin, y el rótulo lo confirma: los 4 Fantásticos volverán en Avengers: Doomsday.`,desc:`Retrofuturismo de los 60 con tecnología adelantada décadas: los 4 Fantásticos no son los primeros héroes, son los únicos. Un universo de exploración más que de conflicto… hasta Galactus. Su número es el cumpleaños de Jack Kirby (28 de agosto).`},{num:`Tierra-838`,nombre:`El mundo de los Illuminati`,ids:[`mom`],c:`#299FCD`,estado:`Activo · sin Illuminati`,desc:`Donde los Vengadores fueron sustituidos por los Illuminati (Captain Carter, Black Bolt, Maria Rambeau, Reed Richards, el Profesor X…), que ejecutaron a su pro :`Foresight (1)`,"1:25":`Foresight (2)`,"1:26":`Foresight (3)`}}})),kn,An=e((()=>{kn={Multiverso:`Multiverse`,Papel:`Print`,"2 (mitad y final)":`2 (mid- and post-credits)`,"1 al final":`1 at the end`,"1 a mitad":`1 mid-credits`,"5 escenas":`5 scenes`,"Saga X-Men (Fox)":`X-Men Saga (Fox)`,"Universo Cinematográfico de Marvel":`Marvel Cinematic Universe`,"Cómics esenciales":`Essential comics`,"La bóveda de animación":`The animation vault`,"El universo mutante de 20th Century Fox son DOS líneas temporales: la original, que Lobezno borra al viajar a 1973 en Días del futuro pasado, y la nueva, que nace ahí y termina en Logan. Se ven en ese orden —no por año de la historia— para que nadie muera antes de aparecer vivo. El puente con el UCM es Deadpool y Lobezno, al final del UCM.":`The 20th Century Fox mutant universe is TWO timelines: the original one, which Wolverine erases by traveling to 1973 in Days of Future Past, and the new one, which is born there and ends with Logan. You watch them in that order — not by in-story year — so nobody dies before showing up alive. The bridge to the MCU is Deadpool & Wolverine, at the end of the MCU.`,"La idea":`The idea`,"En Días del futuro pasado, Lobezno viaja de 2023 a 1973 y evita que Mística mate a Trask, el creador de los Centinelas. Todo lo que pasó entre 1973 y 2023 en la línea original queda borrado y arranca una línea nueva. Hasta DoFP ves la original; desde Apocalipsis, la nueva.":`In Days of Future Past, Wolverine travels from 2023 to 1973 and stops Mystique from killing Trask, the creator of the Sentinels. Everything that happened between 1973 and 2023 in the original timeline is erased and a new one begins. Up to DoFP you're watching the original; from Apocalypse on, the new one.`,"Cómo saber en qué línea estás":`How to tell which timeline you're in`,"Por los actores. Patrick Stewart, Ian McKellen, Rebecca Romijn y Famke Janssen son la línea original (2000–2023). James McAvoy, Michael Fassbender, Jennifer Lawrence y Sophie Turner son los jóvenes: 1962 y 1973 son comunes a las dos líneas, y toda la línea nueva es suya. Hugh Jackman está en ambas porque su mente viaja.":`By the actors. Patrick Stewart, Ian McKellen, Rebecca Romijn and Famke Janssen are the original timeline (2000–2023). James McAvoy, Michael Fassbender, Jennifer Lawrence and Sophie Turner are the young ones: 1962 and 1973 are shared by both timelines, and the whole new timeline is theirs. Hugh Jackman is in both because his mind travels.`,Mística:`Mystique`,"Muere en Fénix Oscura (1992, línea nueva). La que ves viva en X-Men y X-Men 2 es la de la línea borrada. No es un error de orden.":`She dies in Dark Phoenix (1992, new timeline). The one you see alive in X-Men and X-Men 2 is from the erased timeline. It's not an ordering mistake.`,"Lo que no cuadra y conviene aceptar":`What doesn't add up and is best just accepted`,"Xavier camina en Orígenes y en 1973 pese a quedar paralítico en 1962 (DoFP lo explica con un suero; Orígenes, no). En el 2023 de DoFP Lobezno vuelve a tener garras de adamantium sin explicación. Las edades no casan entre 1983 y 2000. Fox nunca cuidó la continuidad, y no hay orden que lo arregle.":`Xavier walks in Origins and in 1973 despite being paralyzed in 1962 (DoFP explains it with a serum; Origins doesn't). In DoFP's 2023, Wolverine has adamantium claws again with no explanation. The ages don't line up between 1983 and 2000. Fox never cared about continuity, and no viewing order can fix it.`,"Las series":`The series`,"The Gifted, Legion, la serie animada y X-Men '97 van por libre: no afectan a las películas ni las películas a ellas.":`The Gifted, Legion, the animated series and X-Men '97 stand on their own: they don't affect the films, and the films don't affect them.`,"La línea original":`The original timeline`,"Charles y Erik se conocen en plena Guerra Fría y fundan los primeros X-Men.":`Charles and Erik meet at the height of the Cold War and found the first X-Men.`,"El pasado de Logan: el programa Arma X y el adamantium.":`Logan's past: the Weapon X program and the adamantium.`,"Salta entre décadas; su grueso ocurre en 1979. La bala de adamantium del final le borra la memoria: por eso en X-Men (2000) no recuerda nada.":`It jumps across decades; most of it takes place in 1979. The adamantium bullet at the end wipes his memory: that's why he remembers nothing in X-Men (2000).`,"Magneto amenaza a la humanidad y los X-Men de Xavier debutan en el cine.":`Magneto threatens humanity and Xavier's X-Men make their big-screen debut.`,"Línea original: esta Mística (Rebecca Romijn) está viva porque la línea aún no ha sido borrada.":`Original timeline: this Mystique (Rebecca Romijn) is alive because the timeline hasn't been erased yet.`,"Un militar ataca la mansión y obliga a mutantes rivales a aliarse.":`A military man attacks the mansion and forces rival mutants to join forces.`,"Una «cura» mutante y el regreso de Fénix lo dividen todo.":`A mutant “cure” and the return of the Phoenix split everything apart.`,"Mueren Jean, Cíclope y Xavier, y Magneto pierde sus poderes: todo esto será borrado en Días del futuro pasado. Quédate a la escena tras los créditos, que explica cómo vuelve Xavier.":`Jean, Cyclops and Xavier die, and Magneto loses his powers: all of this will be erased in Days of Future Past. Stay for the scene after the credits — it explains how Xavier comes back.`,"Logan viaja a Japón y se enfrenta a su propia inmortalidad.":`Logan travels to Japan and faces his own immortality.`,"Sus post-créditos son la bisagra de la saga: Xavier y Magneto, con poderes otra vez, avisan de Trask y los Centinelas.":`Its post-credits scene is the hinge of the whole saga: Xavier and Magneto, powers restored, warn about Trask and the Sentinels.`,"prepara Días del futuro pasado":`sets up Days of Future Past`,"Lobezno viaja a 1973 para evitar el futuro de los Centinelas.":`Wolverine travels to 1973 to prevent the Sentinel future.`,"Aquí se parte la saga: el 2023 de los Centinelas es el futuro de la línea original (la de X-Men 1, 2 y 3), y el viaje a 1973 la borra. Todo lo que viene después ocurre en la línea nueva.":`This is where the saga splits: the Sentinel 2023 is the future of the original timeline (the one from X-Men 1, 2 and 3), and the trip to 1973 erases it. Everything that comes after happens in the new timeline.`,"La línea nueva":`The new timeline`,"El primer mutante de la historia despierta y quiere rehacer el mundo.":`The first mutant in history awakens and wants to remake the world.`,"Primera película que ocurre entera en la línea nueva.":`First film that takes place entirely in the new timeline.`,"Jean Grey absorbe una fuerza cósmica que no puede controlar.":`Jean Grey absorbs a cosmic force she cannot control.`,"Mística muere aquí, en la línea nueva; la Mística de X-Men 1 y 2 vivía en la línea borrada.":`Mystique dies here, in the new timeline; the Mystique from X-Men 1 and 2 lived in the erased one.`,"Wade Wilson busca venganza sin dejar de romper la cuarta pared.":`Wade Wilson hunts for revenge while never once dropping the fourth-wall breaks.`,"al estilo Ferris Bueller":`Ferris Bueller style`,"Wade monta la X-Force para proteger a un chaval del viajero temporal Cable.":`Wade puts together X-Force to protect a kid from the time traveler Cable.`,"Confirma la línea nueva: en la mansión aparecen los X-Men jóvenes de Apocalipsis. La escena post-créditos que mata al Deadpool de Orígenes es un chiste; no cuenta.":`It confirms the new timeline: the young X-Men from Apocalypse show up at the mansion. The post-credits scene that kills the Origins Deadpool is a joke; it doesn't count.`,"imprescindible: reescribe el final":`essential: it rewrites the ending`,"Cinco jóvenes mutantes atrapados en un hospital lleno de secretos.":`Five young mutants trapped in a hospital full of secrets.`,"Historia independiente; su fecha exacta es ambigua.":`Standalone story; its exact date is ambiguous.`,"Un Logan envejecido cruza el país para salvar a una niña como él.":`An aged Logan crosses the country to save a girl just like him.`,"El cierre de la saga. Un futuro posible de la línea nueva, no una continuación exacta de Fénix Oscura: un ataque de Xavier mató a los X-Men fuera de cámara.":`The saga's closer. A possible future of the new timeline, not an exact continuation of Dark Phoenix: an attack by Xavier killed the X-Men off-screen.`,"Las series, con continuidad propia":`The series, with their own continuity`,"Una familia huye con sus hijos mutantes en un mundo sin X-Men.":`A family goes on the run with their mutant kids in a world without X-Men.`,"Continuidad paralela del universo Fox.":`Parallel continuity within the Fox universe.`,"David Haller, el hijo de Xavier, entre la esquizofrenia y un poder inmenso.":`David Haller, Xavier's son, caught between schizophrenia and immense power.`,"La rareza de autor del universo X-Men; continuidad propia.":`The auteur oddity of the X-Men universe; its own continuity.`,"La serie de los 90 que definió a los X-Men para una generación.":`The '90s series that defined the X-Men for a generation.`,"Prólogo directo de X-Men '97: los foros la consideran imprescindible antes de '97.":`Direct prologue to X-Men '97: the forums consider it essential viewing before '97.`,"Continuación directa de la serie animada de los 90, y a su altura.":`A direct continuation of the '90s animated series, and every bit its equal.`,"Películas, series de Disney+ y especiales en orden cronológico de la historia, desde 1943 hasta hoy.":`Films, Disney+ series and specials in story-chronological order, from 1943 to today.`,"A diferencia de los X-Men, el UCM es una sola línea: nada se borra. Los saltos que notarás vienen de dos cosas, el Chasquido y el multiverso, y las dos se explican aquí.":`Unlike the X-Men, the MCU is a single timeline: nothing gets erased. The jumps you'll notice come from two things, the Snap and the multiverse, and both are explained here.`,"El Chasquido y el Lapso":`The Snap and the Blip`,"En Infinity War (2018) Thanos borra a la mitad del universo. Endgame salta cinco años, a 2023, y los devuelve. Todo lo posterior habla del «Lapso» (Blip): los desaparecidos no envejecieron, y por eso Peter Parker sigue en el instituto en 2024.":`In Infinity War (2018) Thanos wipes out half the universe. Endgame jumps five years ahead, to 2023, and brings them back. Everything after that talks about the “Blip”: the vanished didn't age, which is why Peter Parker is still in high school in 2024.`,"Los viajes en el tiempo de Endgame no borran nada":`Endgame's time travel doesn't erase anything`,"Crean ramas. El Loki de 2012 escapa con el Teseracto y de ahí nacen la serie Loki, la TVA y las variantes: por eso Loki va justo después de Endgame aunque esté «fuera del tiempo». What If…?, Marvel Zombies y Your Friendly Neighborhood Spider-Man son otros universos: se ven ahí, pero no tocan la línea principal.":`It creates branches. The 2012 Loki escapes with the Tesseract, and from there come the Loki series, the TVA and the variants: that's why Loki goes right after Endgame even though it's “outside of time”. What If…?, Marvel Zombies and Your Friendly Neighborhood Spider-Man are other universes: you watch them there, but they don't touch the main timeline.`,"El multiverso":`The multiverse`,"No Way Home trae a los Spider-Man de las películas de Sony (por eso ese bloque va justo antes), y Multiverso de la locura y Loki T2 lo consolidan. Los 4 Fantásticos viven en otra Tierra, en unos años 60 alternativos. Y Deadpool y Lobezno viene del universo Fox: por eso la saga X-Men entera se ve antes y esa película casi al final, como puente. Doomsday junta a todos.":`No Way Home brings in the Spider-Men from the Sony films (that's why that block goes right before it), and Multiverse of Madness and Loki S2 cement it. The Fantastic Four live on another Earth, in an alternate 1960s. And Deadpool & Wolverine comes from the Fox universe: that's why the whole X-Men saga is watched earlier and that film goes near the very end, as the bridge. Doomsday brings everyone together.`,"Las series de Netflix y ABC":`The Netflix and ABC series`,"Agents of S.H.I.E.L.D., Daredevil, Jessica Jones y compañía se hicieron aparte y durante años no contaron. Daredevil: Born Again las recupera con los mismos actores. Se pueden saltar sin perder el hilo de las películas.":`Agents of S.H.I.E.L.D., Daredevil, Jessica Jones and company were made separately and for years didn't count. Daredevil: Born Again brings them back with the same actors. You can skip them without losing the thread of the films.`,"Cómo saber dónde estás":`How to tell where you are`,"Si mencionan el Lapso, estás después de 2023. Si Thanos sigue vivo, antes de 2018. Si alguien habla de variantes o de la TVA, estás en la saga del multiverso.":`If they mention the Blip, you're after 2023. If Thanos is still alive, before 2018. If someone talks about variants or the TVA, you're in the Multiverse Saga.`,"Los orígenes":`The origins`,"Steve Rogers se convierte en el supersoldado que planta cara a Hydra.":`Steve Rogers becomes the super-soldier who stands up to Hydra.`,"Peggy Carter funda en la posguerra lo que acabará siendo S.H.I.E.L.D.":`In the post-war years, Peggy Carter founds what will become S.H.I.E.L.D.`,"Carol Danvers recompone su pasado en plena guerra entre Kree y Skrulls.":`Carol Danvers pieces her past back together in the middle of the Kree–Skrull war.`,"Tony Stark construye en una cueva la armadura que lo cambia todo.":`Tony Stark builds, in a cave, the armor that changes everything.`,"En Civil War, Visión sitúa la revelación de Stark 8 años antes de 2016.":`In Civil War, Vision places Stark's reveal 8 years before 2016.`,"la escena que arrancó el UCM":`the scene that kicked off the MCU`,"Tony lidia con su legado y con Vanko mientras el reactor lo envenena.":`Tony wrestles with his legacy and with Vanko while the reactor poisons him.`,"La «Gran Semana de Fury»: Iron Man 2, Thor y El i o":`In development`,"El UCM — la Línea Sagrada":`The MCU — the Sacred Timeline`,"Línea sagrada · activa":`Sacred timeline · active`,"El universo principal del cine. Se llamó Tierra-199999 hasta que el libro oficial de Marvel Studios (The MCU: An Official Timeline, 2023) lo numeró 616, como el de los cómics, y Deadpool y Lobezno lo dijo en pantalla. Es la «línea temporal sagrada» que la TVA protege: cada evento nexo que la desvía genera una rama que la TVA poda.":`The main film universe. It was called Earth-199999 until Marvel Studios' official book (The MCU: An Official Timeline, 2023) numbered it 616, matching the comics, and Deadpool & Wolverine said it on screen. It's the “Sacred Timeline” the TVA protects: every nexus event that pushes it off course spawns a branch the TVA prunes.`,"La saga X-Men de Fox":`Fox's X-Men saga`,"Salvada · con un Logan de otra Tierra":`Saved · with a Logan from another Earth`,"El universo mutante de Fox. Su «ser ancla» era Lobezno: tras su muerte en Logan empezó a desvanecerse, hasta que Deadpool y un Lobezno de otra Tierra destruyen el Desgarrador Temporal y lo salvan; ese Logan se queda a vivir en él.":`Fox's mutant universe. Its “anchor being” was Wolverine: after his death in Logan it began to fade, until Deadpool and a Wolverine from another Earth destroy the Time Ripper and save it; that Logan stays there.`,"El vertedero del tiempo":`The dumping ground of time`,"Fin del tiempo · dominio de Alioth":`End of time · Alioth's domain`,"Donde la TVA arroja todo lo podado: no es destrucción, es exilio. Custodiado por Alioth y gobernado por Cassandra Nova en Deadpool y Lobezno, alberga variantes de Loki (el clásico, el niño, el caimán…) y reliquias de películas canceladas: el Blade, la Elektra y la Antorcha Humana de otros tiempos. Deadpool y Lobezno demostraron que se puede salir.":`Where the TVA dumps everything it prunes: it's not destruction, it's exile. Guarded by Alioth and ruled by Cassandra Nova in Deadpool & Wolverine, it holds
