# Proyecto de Xcode descrito en texto: `cd ios && xcodegen` genera Maraton.xcodeproj
# (fuera de git). Antes, `npm run ios:datos` en la raíz para los datos.
name: Maraton
options:
  bundleIdPrefix: com.ssebv
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  MaratonKit:
    path: MaratonKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Maraton:
    type: application
    platform: iOS
    sources: [Maraton]
    dependencies:
      - package: MaratonKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ssebv.maraton
        # Para el iPhone: el equipo personal de tu Apple ID (Xcode › Signing)
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Maratón Marvel"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    info:
      path: Maraton/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.ssebv.maraton
            CFBundleURLSchemes: [maraton]
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
