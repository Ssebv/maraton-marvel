# Proyecto de Xcode descrito en texto: `cd ios && xcodegen` genera Maraton.xcodeproj
# (fuera de git). Antes, `npm run ios:datos` en la raíz para los datos.
name: Maraton
options:
  bundleIdPrefix: com.ssebv
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  MaratonKit:
    path: MaratonKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Maraton:
    type: application
    platform: iOS
    sources: [Maraton, Compartido]
    dependencies:
      - package: MaratonKit
      - target: MaratonWidget
    # la sonda de fluidez (MaratonUITests) va en su esquema
    scheme:
      testTargets: [MaratonUITests]
    # La app y el widget comparten un grupo del llavero (Compartido/FotoWidget.swift)
    entitlements:
      path: Maraton/Maraton.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.ssebv.maraton.compartido"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ssebv.maraton
        # Para el iPhone: el equipo personal de tu Apple ID (Xcode › Signing)
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Maratón Marvel"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    info:
      path: Maraton/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.ssebv.maraton
            CFBundleURLSchemes: [maraton]
        UIAppFonts: [ArchivoBlack.ttf]
        # .cbz/.cbr no son tipos del sistema: sin esto el selector de archivos no los deja elegir
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.ssebv.maraton.cbz
            UTTypeDescription: Comic Book ZIP
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
          - UTTypeIdentifier: com.ssebv.maraton.cbr
            UTTypeDescription: Comic Book RAR
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [cbr]
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        GrupoLlavero: "$(AppIdentifierPrefix)com.ssebv.maraton.compartido"
  MaratonWidget:
    type: app-extension
    platform: iOS
    sources: [MaratonWidget, Compartido]
    entitlements:
      path: MaratonWidget/MaratonWidget.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.ssebv.maraton.compartido"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ssebv.maraton.widget
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Maratón"
        SKIP_INSTALL: YES
    info:
      path: MaratonWidget/Info.plist
      properties:
        CFBundleDevelopmentRegion: es
        GrupoLlavero: "$(AppIdentifierPrefix)com.ssebv.maraton.compartido"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # Sonda de fluidez: mide los tirones al deslizar cada pantalla (ver FluidezTests.swift)
  MaratonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MaratonUITests]
    dependencies:
      - target: Maraton
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ssebv.maraton.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Maraton
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
