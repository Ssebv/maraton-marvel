name: 🧭 Sugerir un cambio de orden
description: ¿Algún título va antes o después de donde está? Cuéntanos.
title: "[Orden] "
labels: [orden]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias! El orden de la app sigue la historia (cuándo ocurre), no la fecha de estreno. Si crees que algo está fuera de su sitio, cuéntanos por qué.
  - type: input
    id: titulo
    attributes:
      label: ¿Qué título moverías?
      placeholder: "Ej.: Capitana Marvel"
    validations:
      required: true
  - type: input
    id: donde
    attributes:
      label: ¿Dónde lo pondrías?
      placeholder: "Ej.: justo antes de Iron Man"
    validations:
      required: true
  - type: textarea
    id: por-que
    attributes:
      label: ¿Por qué?
      description: Una escena, una fecha que sale en pantalla, un enlace… lo que te haga pensarlo. Si hay spoilers, avísalo al principio.
    validations:
      required: true
