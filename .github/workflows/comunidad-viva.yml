# Mantiene vivo el proyecto gratuito de Supabase y poda lo viejo.
# El plan gratuito pausa un proyecto tras una semana sin actividad: esta tarea
# llama cada 3 días a public.mantenimiento() con la clave pública (la misma que
# lleva la app), que además borra actividad de más de 90 días y avisos viejos.
# GitHub Actions es gratis en repositorios públicos. No hace nada hasta que
# existan las variables del repositorio SUPABASE_URL y SUPABASE_ANON_KEY
# (Settings → Secrets and variables → Actions → Variables): supabase/LEEME.md.
# Ojo: GitHub apaga las tareas programadas tras 60 días sin commits en el
# repositorio; cualquier commit (o «Enable workflow» en la pestaña Actions) la
# vuelve a encender.
name: Comunidad viva
on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:
jobs:
  mantenimiento:
    if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Llamar a mantenimiento()
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          respuesta=$(curl -sS --fail-with-body -X POST "$URL/rest/v1/rpc/mantenimiento" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "$respuesta"
          bytes=$(echo "$respuesta" | sed -n 's/.*"bytes": *\([0-9]*\).*/\1/p')
          # aviso al 70 % de los 500 MB del plan gratuito
          if [ -n "$bytes" ] && [ "$bytes" -gt 367000000 ]; then
            echo "::warning::La base ocupa $((bytes / 1048576)) MB: más del 70 % del plan gratuito"
          fi
